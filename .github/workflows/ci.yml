name: Linter and tests

on:
  pull_request:
    branches:
      - main

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      
      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=3m

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run tests
        run: |
          go test -v -race -count=1 -cover ./pkg/...

      - name: Run benchmarks
        run: |
          go test -run=^$ -bench=BenchmarkPipeline -benchtime=1000x -benchmem ./pkg/transport/...
